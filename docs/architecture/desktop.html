<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudSim 桌面端 · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · CloudSim Desktop</p>
    <h1>桌面端进程与共享后端</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cs-desktop-title cs-desktop-desc">
      <title id="cs-desktop-title">CloudSim 桌面端架构</title>
      <desc id="cs-desktop-desc">操作员通过 CloudSim.exe 的 Qt/OSG UI 进入 CloudSimHost，再调用 CloudSimCore、Data、Robot、Geometry 与插件等共享 DLL。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: UI -->
      <rect x="340" y="72" width="172" height="120" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="400" y="76" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="426" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">DESKTOP UI</text>

      <!-- Zone: Shared backend -->
      <rect x="700" y="100" width="260" height="280" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="776" y="104" width="108" height="12" rx="2" fill="#f5f5f5"/>
      <text x="830" y="113" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">SHARED BACKEND</text>

      <!-- Arrows (behind nodes) -->
      <line x1="168" y1="248" x2="196" y2="248" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="340" y1="248" x2="540" y2="248" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M 268,216 V 140 H 348" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Host right edge fans: y=232 / 248 / 264 -->
      <path d="M 700,232 H 720 Q 728,232 728,224 V 164" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="700" y1="248" x2="740" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 700,264 H 720 Q 728,264 728,272 V 332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="168" y="228" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="182" y="237" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UI</text>

      <rect x="248" y="172" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="268" y="181" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EMBED</text>

      <rect x="420" y="228" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="440" y="237" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOST</text>

      <rect x="640" y="180" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="664" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CORE</text>

      <rect x="704" y="228" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="718" y="237" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DOM</text>

      <rect x="640" y="300" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="664" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOAD</text>

      <!-- Operator -->
      <rect x="40" y="216" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="216" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="224" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="233" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="104" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operator</text>
      <text x="104" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Desktop window</text>

      <!-- CloudSim.exe -->
      <rect x="196" y="216" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="196" y="216" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="204" y="224" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="218" y="233" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="268" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CloudSim.exe</text>
      <text x="268" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CloudSim.sln</text>

      <!-- Qt / OSG UI -->
      <rect x="352" y="108" width="148" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="352" y="108" width="148" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="360" y="116" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="374" y="125" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="426" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Qt / OSG UI</text>
      <text x="426" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Widget · RobotWidget</text>

      <!-- CloudSimHost (focal) -->
      <rect x="540" y="216" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="540" y="216" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="548" y="224" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="566" y="233" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
      <text x="688" y="276" fill="rgba(235,108,54,0.10)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
      <text x="620" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CloudSimHost</text>
      <text x="620" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">document host</text>

      <!-- CloudSimCore / Data -->
      <rect x="740" y="132" width="180" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="740" y="132" width="180" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="748" y="140" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="766" y="149" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="830" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Core / Data</text>
      <text x="830" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">contracts · persist</text>

      <!-- Robot / Geometry -->
      <rect x="740" y="216" width="180" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="740" y="216" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="748" y="224" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="766" y="233" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DOM</text>
      <text x="830" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Robot / Geometry</text>
      <text x="830" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">URDF · OCC · point cloud</text>

      <!-- Plugins -->
      <rect x="740" y="300" width="180" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="740" y="300" width="180" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="748" y="308" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="766" y="317" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLG</text>
      <text x="830" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plugins</text>
      <text x="830" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">geomod · process · PLC</text>

      <!-- Legend -->
      <line x1="40" y1="420" x2="960" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="456" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Host / focal</text>

      <rect x="168" y="456" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="188" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">App / domain</text>

      <rect x="300" y="456" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="320" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

      <rect x="396" y="456" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="416" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External</text>

      <line x1="520" y1="462" x2="548" y2="462" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="556" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary</text>

      <line x1="640" y1="462" x2="668" y2="462" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="676" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">User / UI</text>
    </svg>
  </div>
</body>
</html>
