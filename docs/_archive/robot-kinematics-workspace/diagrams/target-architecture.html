<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot kinematics target architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · CloudSim Robot</p>
    <h1>Target kinematics split</h1>
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="target-architecture-title target-architecture-desc">
      <title id="target-architecture-title">Target kinematics split</title>
      <desc id="target-architecture-desc">UI calls RobotScene TeachIk strategy, which uses RobotUrdf kinematics core with Workspace; DH remains a dashed legacy path.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- zones -->
      <rect x="40" y="48" width="280" height="520" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="52" y="52" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="76" y="61" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">UI</text>

      <rect x="360" y="48" width="320" height="520" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="372" y="52" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="416" y="61" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ROBOTSCENE</text>

      <rect x="720" y="48" width="400" height="520" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="732" y="52" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="772" y="61" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ROBOTURDF</text>

      <!-- arrows -->
      <line x1="320" y1="200" x2="360" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="324" y="176" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="342" y="185" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TEACH</text>

      <line x1="680" y1="240" x2="720" y2="240" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="684" y="216" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="700" y="225" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DLS</text>

      <line x1="920" y1="320" x2="920" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 520 320 V 420 H 720" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="560" y="396" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="588" y="405" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEGACY</text>

      <!-- nodes -->
      <rect x="72" y="160" width="216" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="160" width="216" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="80" y="166" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="100" y="175" fill="rgba(45,49,66,0.80)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="180" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RobotWidget</text>
      <text x="180" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TCP drag / chase</text>

      <rect x="400" y="160" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="160" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="166" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="436" y="175" fill="rgba(45,49,66,0.80)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCENE</text>
      <text x="520" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TeachIk strategy</text>
      <text x="520" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ext axes · coordinated cost</text>

      <rect x="400" y="280" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="280" width="240" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="520" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">InstructionController</text>
      <text x="520" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">plan · program · pose sink</text>

      <rect x="760" y="160" width="320" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="160" width="320" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="768" y="166" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="788" y="175" fill="rgba(235,108,54,0.90)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="920" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UrdfNumericalIk + FK/J</text>
      <text x="920" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Options · DLS · geometric J</text>

      <rect x="760" y="360" width="320" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="360" width="320" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="768" y="366" width="72" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="804" y="375" fill="rgba(235,108,54,0.90)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WORKSPACE</text>
      <text x="920" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UrdfKinematicsWorkspace</text>
      <text x="920" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">index BFS · pooled buffers</text>

      <rect x="760" y="480" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="480" width="320" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="920" y="512" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DH SerialLinkKinematics</text>

      <!-- legend -->
      <line x1="40" y1="600" x2="1240" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="628" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="160" y="616" width="16" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="184" y="628" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Focal core</text>
      <rect x="320" y="616" width="16" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="344" y="628" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Active path</text>
      <rect x="480" y="616" width="16" height="16" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="504" y="628" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Legacy DH</text>
    </svg>
  </div>
</body>
</html>
