# PointNet++ 分类训练配置
task: classification
num_points: 1024
batch_size: 32
epochs: 100
learning_rate: 0.001
lr_scheduler: cosine  # cosine / step
weight_decay: 0.0001
num_workers: 4

# 数据集
dataset:
  root: datasets/classification
  train_split: train
  val_split: val
  test_split: test

# 类别（与 pointnet_config.json 一致）
classes:
  - box
  - cylinder
  - sphere
  - cone
  - complex

# 模型
model:
  name: pointnet2_cls
  dropout: 0.5

# 数据增强
augmentation:
  random_rotate_z: true
  random_scale: true
  scale_range: [0.8, 1.2]
  random_translate: true
  translate_range: 0.1
  jitter: true
  jitter_std: 0.01

# 输出
output_dir: output/cls
checkpoint_every: 10
