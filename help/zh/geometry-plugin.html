<h1>几何分析插件</h1>
<p>Geometry 插件提供离散与求交等通用几何工具（侧栏入口，插件加载后可见）。</p>
<ul>
  <li>离散化 STEP 文件或场景中的 B-rep/网格</li>
  <li>密度控制：质量档、目标边长、面片数等</li>
  <li>边–面 / 面–面求交，并可在视口中拾取结果</li>
  <li>由交线生成 Tube / Ribbon 网格</li>
</ul>

<p class="footer">CloudSim 用户帮助 · 左侧目录选择章节</p>
</body>
