<h1>PLC 通讯与工业相机</h1>
<h2>PLC</h2>
<ul>
  <li>侧栏连接 AB Ethernet/IP、Modbus TCP 等</li>
  <li>标签表：读/写/轮询；多种显示格式</li>
</ul>
<h2>工业相机</h2>
<ul>
  <li>支持海康、Mech-Eye、模拟相机等后端</li>
  <li>手眼标定：Ensemble 与 Mech 官方候选；标定板检测</li>
  <li>可结合机器人 TCP 位姿 JSON 完成标定流程</li>
</ul>
